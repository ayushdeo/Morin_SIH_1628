<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-label="Platform modules">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05070d"/><stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3fb950"/>
    </marker>
    <style>
      .sans { font-family: "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: Consolas, Menlo, Monaco, monospace; }
      .b { fill: rgba(63,185,80,0.08); stroke: rgba(63,185,80,0.32); stroke-width:1.5; }
      .b2 { fill: rgba(88,166,255,0.08); stroke: rgba(88,166,255,0.30); stroke-width:1.5; }
      .t { fill:#e6edf3; } .d { fill:#8b949e; }
    </style>
  </defs>
  <rect width="1200" height="230" rx="16" fill="url(#bg)"/>
  <text x="24" y="38" class="sans" font-size="18" font-weight="700" fill="#e6edf3">Three Streamlit modules — assess, recommend, analyze</text>

  <rect class="b" x="24"  y="66" width="360" height="120" rx="12"/>
  <text x="42" y="96" class="sans t" font-size="16" font-weight="700">1 · Skill assessment</text>
  <text x="42" y="124" class="mono d" font-size="12.5">domain quiz scores five cyber tracks:</text>
  <text x="42" y="146" class="mono d" font-size="12.5">network security, threat analysis,</text>
  <text x="42" y="168" class="mono d" font-size="12.5">incident response, GRC, pentest</text>

  <rect class="b2" x="418" y="66" width="360" height="120" rx="12"/>
  <text x="436" y="96" class="sans t" font-size="16" font-weight="700">2 · Course recommender</text>
  <text x="436" y="124" class="mono d" font-size="12.5">TF-IDF + KMeans clustering over</text>
  <text x="436" y="146" class="mono d" font-size="12.5">Coursera catalog; cosine similarity</text>
  <text x="436" y="168" class="mono d" font-size="12.5">maps skill gaps → learning paths</text>

  <rect class="b2" x="812" y="66" width="364" height="120" rx="12"/>
  <text x="830" y="96" class="sans t" font-size="16" font-weight="700">3 · Market analytics</text>
  <text x="830" y="124" class="mono d" font-size="12.5">Sentence-Transformer search +</text>
  <text x="830" y="146" class="mono d" font-size="12.5">demand growth by city / experience,</text>
  <text x="830" y="168" class="mono d" font-size="12.5">visualized with seaborn</text>

  <g stroke="#3fb950" stroke-width="2" marker-end="url(#arw)">
    <line x1="386" y1="126" x2="416" y2="126"/>
    <line x1="780" y1="126" x2="810" y2="126"/>
  </g>
</svg>
