<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Cybersecurity Skilling Platform">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05070d"/><stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3fb950"/><stop offset="100%" stop-color="#58a6ff"/>
    </linearGradient>
    <style>
      .sans { font-family: "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: Consolas, Menlo, Monaco, monospace; }
    </style>
  </defs>
  <rect width="1200" height="300" rx="20" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <!-- shield motif -->
  <path d="M1075 76 L1140 100 V150 C1140 195 1110 215 1075 228 C1040 215 1010 195 1010 150 V100 Z"
        fill="rgba(63,185,80,0.12)" stroke="#3fb950" stroke-width="2"/>
  <path d="M1048 150 l18 20 l38 -44" fill="none" stroke="#3fb950" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="64" y="112" class="sans" font-size="42" font-weight="700" fill="#e6edf3">Cybersecurity Skilling Platform</text>
  <text x="66" y="156" class="mono" font-size="19" fill="#9fb0c3">Skill assessment → personalized course paths →</text>
  <text x="66" y="182" class="mono" font-size="19" fill="#9fb0c3">job-market analytics — Smart India Hackathon (PS 1628)</text>

  <g class="mono" font-size="15" fill="#7d8590">
    <text x="66" y="234">Streamlit</text><text x="180" y="234" fill="#30363d">|</text>
    <text x="200" y="234">scikit-learn</text><text x="330" y="234" fill="#30363d">|</text>
    <text x="350" y="234">Sentence-Transformers</text><text x="600" y="234" fill="#30363d">|</text>
    <text x="620" y="234">TF-IDF + KMeans</text>
  </g>
  <text x="66" y="276" class="mono" font-size="13" fill="#484f58">Skill-gap analysis · course recommender · market insights · github.com/ayushdeo</text>
</svg>
